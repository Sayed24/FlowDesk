<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="FlowDesk offline-first personal productivity dashboard"
  >

  <meta name="theme-color" content="#6d5dfc">

  <title>FlowDesk</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
  <div id="app" class="app">

    <div
      id="sidebarOverlay"
      class="sidebar-overlay"
      hidden
    ></div>

    <aside id="sidebar" class="sidebar" aria-label="Main navigation">
      <div class="sidebar-header">
        <a href="#/dashboard" class="brand">
          <span class="brand-mark">F</span>
          <span class="brand-name">FlowDesk</span>
        </a>

        <button
          id="closeSidebarBtn"
          class="icon-button mobile-only"
          type="button"
          aria-label="Close navigation"
        >
          ✕
        </button>
      </div>

      <nav id="desktopNav" class="desktop-nav"></nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div id="sidebarAvatar" class="avatar">DU</div>

          <div class="user-card-copy">
            <strong id="sidebarUserName">Demo User</strong>
            <span id="sidebarUserRole">Demo mode</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button
            id="menuBtn"
            class="icon-button mobile-only"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
          >
            ☰
          </button>

          <div>
            <p id="pageEyebrow" class="topbar-eyebrow">Overview</p>
            <h1 id="pageTitle" class="topbar-title">Dashboard</h1>
          </div>
        </div>

        <div class="topbar-actions">
          <button
            id="searchBtn"
            class="icon-button"
            type="button"
            aria-label="Search"
          >
            🔍
          </button>

          <button
            id="themeBtn"
            class="icon-button"
            type="button"
            aria-label="Toggle theme"
          >
            <span id="themeIcon">🌙</span>
          </button>

          <button
            id="notificationBtn"
            class="icon-button notification-button"
            type="button"
            aria-label="Notifications"
          >
            🔔
            <span
              id="notificationDot"
              class="notification-dot"
            ></span>
          </button>

          <button
            id="profileBtn"
            class="profile-button"
            type="button"
          >
            <span id="topbarAvatar" class="avatar avatar-small">DU</span>

            <span class="profile-copy">
              <strong id="topbarUserName">Demo User</strong>
              <small id="topbarUserRole">Demo</small>
            </span>
          </button>
        </div>
      </header>

      <section id="demoBanner" class="demo-banner">
        <div>
          <strong>Demo mode</strong>
          <span>Your information is stored only in this browser.</span>
        </div>

        <button
          id="openAuthBtn"
          class="button button-small button-secondary"
          type="button"
        >
          Create local account
        </button>
      </section>

      <section
        id="view"
        class="view"
        tabindex="-1"
        aria-live="polite"
      ></section>
    </main>
  </div>

  <nav
    id="mobileNav"
    class="mobile-nav"
    aria-label="Mobile navigation"
  ></nav>

  <button
    id="fab"
    class="fab"
    type="button"
    aria-label="Create new item"
  >
    ＋
  </button>

  <div id="modalRoot"></div>
  <div id="drawerRoot"></div>
  <div id="toastRoot" class="toast-stack"></div>

  <template id="loadingTemplate">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading FlowDesk…</p>
    </div>
  </template>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
